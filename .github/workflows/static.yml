# Svara Lab: test the offline synthesizer, then deploy only the public app.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Sanskrit parser and acoustic synthesis
        run: node qa/2026-11-13/test_articulation.mjs
      - name: Verify gesture and consonant contrasts
        run: node qa/2026-11-13/test_phoneme_dynamics.mjs

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage only the public standalone app
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
